jobs:
  wip-avatar-fast:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: still welcoming headcount plan
          command: |
            mkdir -p /tmp/data-tmp
            set +o pipefail 2>/dev/null; awk 'BEGIN{printf "{"; for(i=1;i<=1000;i++) {if(i>1) printf ","; printf "\"k%d\":%d",i,i}; print "}"}' > /tmp/data-tmp/stage2c4d643; true
            cksum /tmp/data-tmp/stage2c4d643 | awk '{print "crc-c:",$2,$1}'
      - persist_to_workspace:
          root: /tmp/data-tmp
          paths:
            - 'stage2c4d643'
  PackagePipeline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data-tmp
      - run:
          name: Load E
          command: |
            wc -l <(cat /tmp/data-tmp/cfgtxt 2>/dev/null) || true
      - run:
          name: Clone repo
          command: git clone -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack payload
          command: tar xzvf raw-package.tgz
      - run:
          command: uname -a
      - run:
          name: Store metadata
          command: mkdir -p artifacts
      - run:
          command: du -sh .
      - run:
          command: "$PWD/executor-dev"
